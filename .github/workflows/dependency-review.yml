name: Dependency review
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-review:
    name: Dependency review
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # inspected upstream commit, 2026-10-16
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
