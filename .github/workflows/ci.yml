name: Rele CI and release candidate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rele-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build installers and portable runtime, verify the extracted archive
        run: |
          npm run package
          node scripts/smoke-package.mjs
      - name: Verify the real Windows installer lifecycle
        if: runner.os == 'Windows'
        run: node scripts/smoke-windows-installer.mjs
      - name: Verify the real Debian package and systemd lifecycle
        if: runner.os == 'Linux'
        run: node scripts/smoke-linux-installer.mjs
      - name: Install the isolated protocol fixture
        run: |
          python -m pip install -r scripts/protocol-requirements.txt
          npm install --prefix "$RUNNER_TEMP/codex-probe" --ignore-scripts --no-audit --no-fund --no-package-lock @openai/codex@0.163.0
      - name: Verify the actual Codex protocol without credentials or a real model
        run: python scripts/protocol-probe.py --codex-prefix "$RUNNER_TEMP/codex-probe" --report protocol-results.json
      - name: Install the pinned local speech environment and public fixture
        run: |
          python -m pip install -r scripts/voice-requirements.txt
          python scripts/fetch-voice-fixture.py --directory "$RUNNER_TEMP/voice-fixture"
      - name: Verify actual CPU transcription with network syscalls denied
        if: runner.os == 'Linux'
        run: python scripts/probe-voice-offline.py --model "$RUNNER_TEMP/voice-fixture/tiny" --input "$RUNNER_TEMP/voice-fixture/jfk.flac" --assert-text 'what your country can do for you' --report voice-results.json
      - name: Verify actual Windows CPU transcription from local files
        if: runner.os == 'Windows'
        run: |
          python scripts/transcribe.py --input "$RUNNER_TEMP/voice-fixture/jfk.flac" --model "$RUNNER_TEMP/voice-fixture/tiny" --language en --device cpu > voice-results.json
          python -c 'import json; text=json.load(open("voice-results.json"))["text"]; assert "what your country can do for you" in text.lower()'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify the real production UI and HTTP API
        run: node scripts/smoke-ui.mjs
      - name: Keep diagnostic reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-${{ matrix.os }}
          path: |
            protocol-results.json
            voice-results.json
            installer-results.json
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep verified installers and portable packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portable-${{ matrix.os }}
          path: |
            release/*.zip
            release/*.tar.gz
            release/*-setup.exe
            release/*.deb
            release/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  prerelease:
    name: Publish verified release candidate
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Accept only an explicit RC version
        id: candidate
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const {version} = JSON.parse(readFileSync('package.json', 'utf8'));
          const candidate = /^\d+\.\d+\.\d+-rc\.\d+$/.test(version);
          appendFileSync(process.env.GITHUB_OUTPUT, `publish=${candidate}\nversion=${candidate ? version : ''}\n`);
          if (!candidate) console.log('Stable publishing is disabled until the real Desktop and messenger acceptance gates are closed.');
          JS
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: steps.candidate.outputs.publish == 'true'
        with:
          pattern: portable-*
          path: release-assets
          merge-multiple: true
      - name: Publish a new prerelease
        if: steps.candidate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELE_CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$RELE_CANDIDATE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists and will remain unchanged; bump the RC version for another candidate."
            exit 0
          fi
          (cd release-assets && sha256sum -c ./*.sha256)
          cat > release-notes.md <<'NOTES'
          Rele release candidate for native Windows x64 and Ubuntu Server x64.

          Recommended Windows download: rele-VERSION-windows-x64-setup.exe. Install under your Codex Desktop account, then open Rele from the Start menu. The installer manages a per-user background task, a native launcher, upgrades with backups, and standard Windows uninstallation. Program files go to LOCALAPPDATA/Programs/Rele; data stays in LOCALAPPDATA/Rele. Close an old portable Rele terminal with Ctrl+C before migrating.

          Recommended Ubuntu Server download: rele-VERSION-linux-x64.deb. Install with sudo apt install ./rele-VERSION-linux-x64.deb. The package uses /opt/rele, /usr/bin/rele, and systemd under the invoking sudo user's account. If installed directly as root, select the Codex owner with sudo rele service install --user NAME. Removal, including purge, keeps user conversation data. See docs/INSTALLATION.md.

          Both installers include Node.js 24.19.0 and production dependencies. Codex discovery checks trusted Desktop backend locations, running process metadata, and local CLI installations. The panel distinguishes missing Codex, unavailable shared transport, and a failed catalog load. Opening the installed application uses an expiring single-use login link. Existing chat bindings and saved tokens survive upgrades. Portable ZIP/TAR packages remain available.

          Codex app-server 0.163.0 is the verified protocol version. Rele only attaches to an existing local runtime. The automated protocol fixture uses a local fake model and does not establish live Codex Desktop or real Telegram/Slack compatibility.

          This is an unsigned prerelease, not a completed real Desktop acceptance. Finding Desktop does not guarantee that its internal app-server exposes a shared listener. Rele never silently starts an independent app-server. The Windows Desktop and authorized messenger acceptance scenarios remain mandatory before a stable release. See docs/PLAN.md and the open acceptance issues.
          NOTES
          sed -i "s/VERSION/$RELE_CANDIDATE_VERSION/g" release-notes.md
          gh release create "$tag" release-assets/* --target "$GITHUB_SHA" --prerelease --title "Rele $RELE_CANDIDATE_VERSION" --notes-file release-notes.md
