name: Rele CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Create a draft RC from verified main packages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rele-ci-${{ inputs.release && 'release' || github.ref }}
  cancel-in-progress: ${{ !inputs.release }}

jobs:
  prepare_release:
    name: Prepare unverified draft RC
    if: github.event.repository.private == false && github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci.mjs prepare

  verify:
    if: github.event.repository.private == false && !inputs.release
    uses: ./.github/workflows/verify.yml
    with:
      release: false
    permissions:
      contents: read
      actions: read

  verify_release:
    needs: [prepare_release]
    if: github.event.repository.private == false && github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verify.yml
    with:
      release: true
      release_id: ${{ needs.prepare_release.outputs.release_id }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write

  gate:
    name: CI gate
    needs: [verify, verify_release]
    if: ${{ always() && github.event.repository.private == false && (!inputs.release || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require both OS jobs
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          RELEASE_RESULT: ${{ needs.verify_release.result }}
          EXPECTED_RESULTS: ${{ inputs.release && 'skipped:success' || 'success:skipped' }}
        run: test "$VERIFY_RESULT:$RELEASE_RESULT" = "$EXPECTED_RESULTS"

  publish:
    name: Verify draft RC packages
    needs: [prepare_release, verify_release, gate]
    if: ${{ !cancelled() && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main' && needs.verify_release.result == 'success' && needs.gate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    env:
      RELEASE_ID: ${{ needs.prepare_release.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Download the exact draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci.mjs download
      - name: Verify draft build attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for package in incoming/linux/* incoming/windows/*; do
            gh attestation verify "$package" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/verify.yml" \
              --source-digest "$GITHUB_SHA" --source-ref refs/heads/main \
              --deny-self-hosted-runners
          done
      - name: Verify provenance and finalize the same draft without replacing packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci.mjs publish
